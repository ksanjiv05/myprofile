# nginx site config — static only, no app server, no Node process.
# RAM cost on the VPS is nginx itself (~10-15MB). Nothing else runs.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sanjiv
#   sudo ln -s /etc/nginx/sites-available/sanjiv /etc/nginx/sites-enabled/
#   sudo rsync -a --delete public/ /var/www/myprofile/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d imsanjiv.in -d www.imsanjiv.in

server {
    listen 80;
    listen [::]:80;
    server_name imsanjiv.in www.imsanjiv.in;
    root /var/www/myprofile;
    index index.html;

    # Hash routing means every path serves the same document.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprint-free assets: revalidate, but allow the browser to reuse them.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Pre-compressed files if you run: find public -type f \
    #   \( -name '*.css' -o -name '*.js' -o -name '*.html' \) -exec gzip -9 -k {} \;
    # gzip_static on;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'";

    location = /favicon.ico { access_log off; log_not_found off; }
}
